apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    namespace 'com.rfidresearchgroup.rfidtools'

    defaultConfig {
        applicationId "com.padeltennis.scorer"
        minSdkVersion 21
        targetSdkVersion 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 303
        versionName "1.0.5"
    }
    
    buildFeatures {
        buildConfig = true
    }
    
    signingConfigs {
        release {
            storeFile file('../keystore/@marion808__Padel-Tennis-keystore.bak.jks')
            storePassword '36fa4eff0f97f14bb2dc572992ba9e32'
            keyAlias '790974ee6b46f9d95058d3e1f4a02a14'
            keyPassword 'aa2b5e30c00a0aaf7a03e7b7eb9299aa'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.release
        }
        debug {
            shrinkResources false
            minifyEnabled false
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        //checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        //abortOnError false
        disable 'GoogleAppIndexingWarning'
    }
}

dependencies {
    implementation fileTree(
            include: ['*.jar'],
            dir: 'libs'
    )

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.alibaba:fastjson:1.2.59'
    implementation 'me.drakeet.multitype:multitype:3.5.0'
    implementation 'com.github.zhpanvip:BannerViewPager:2.7.0'
    implementation 'com.github.bumptech.glide:glide:4.5.0'

    annotationProcessor 'com.github.bumptech.glide:compiler:4.5.0'
    
    // Room Database
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    
    // OkHttp for Supabase REST API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation project(':libcrapto1')
    implementation project(':libtag')

    implementation project(':libutils')
    implementation project(':libnfc')
    implementation project(':libcml')
    implementation project(':libcom')
    implementation project(':libpm3')

    implementation project(':libflasher')

    // The dep from TERMUX(A FullTerminal implements.)
    implementation project(":termux-app")
}